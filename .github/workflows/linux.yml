name: Linux Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Check, test and build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install GPUI system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config cmake clang libclang-dev \
            libasound2-dev libfontconfig1-dev libfreetype-dev libx11-xcb-dev \
            libxkbcommon-x11-dev libwayland-dev libvulkan-dev libssl-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libxcb-render0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Type check
        shell: bash
        run: |
          cargo check --locked --all-targets > "$RUNNER_TEMP/type-check.log" 2>&1 && result=0 || result=$?
          cat "$RUNNER_TEMP/type-check.log"
          if [ "$result" -ne 0 ]; then
            python3 - <<'PY'
          import os
          from pathlib import Path
          lines = Path(os.environ["RUNNER_TEMP"], "type-check.log").read_text(errors="replace").splitlines()
          for line in lines[-40:]:
              message = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Linux type check::{message}")
          PY
          fi
          exit "$result"
      - name: Unit tests
        run: cargo test --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked --release
